<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi cita - Beauty Salon</title>
  <meta name="theme-color" content="#140d12">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Beauty Salon">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="logo">✿ BEAUTY <span>SALON</span></div>
    <a href="index.html" class="btn ghost sm" style="text-decoration:none">Reservar otra</a>
  </div>

  <div class="wrap" style="max-width:560px">
    <!-- AVISO "INSTALAR APP": lo muestra u oculta js/instalar.js. Para cambiar el texto, edítalo aquí. -->
    <div id="instalarBox" class="instalar hide" role="region" aria-label="Instalar la app">
      <div class="instalar-txt">
        <b>📲 Instala la app en tu celular</b>
        <span>Queda el ícono en tu pantalla de inicio y abres la página con un toque.</span>
      </div>
      <div class="instalar-acc">
        <button class="btn sm" id="instalarBtn" type="button">Instalar app</button>
        <button class="btn sm ghost" id="instalarCerrar" type="button" aria-label="Cerrar aviso">✕</button>
      </div>
      <div class="instalar-pasos sub hide" id="instalarPasos" aria-live="polite"></div>
    </div>

    <!-- Mientras se busca la cita -->
    <div id="cargando" class="card"><p class="sub">Buscando tu cita…</p></div>

    <!-- Si el enlace no sirve -->
    <div id="error" class="card hide"><h2>No encontramos tu cita</h2><p class="sub" id="errorTxt"></p></div>

    <!-- La cita: estado grande, detalles y botón de avisos -->
    <div id="cita" class="hide">
      <div class="card estado" id="estado" aria-live="polite"></div>
      <div class="card mt"><h2>Tu cita</h2><div id="detalles"></div></div>
      <div class="card mt hide" id="avisosBox"></div>
      <p class="sub mt" style="font-size:13px;text-align:center">Esta página se actualiza sola. Guarda este enlace para volver a verla.</p>
    </div>
  </div>

  <script src="js/instalar.js"></script>
  <script src="js/push.js"></script>
  <script src="js/cita.js"></script>
</body>
</html>
