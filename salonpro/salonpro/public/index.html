<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beauty Salon - Reserva tu cita</title>
  <meta name="theme-color" content="#140d12">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Beauty Salon">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- BARRA SUPERIOR: cambia el nombre de tu salón aquí (también en cita.html y admin.html) -->
  <div class="topbar">
    <div class="logo">✿ BEAUTY <span>SALON</span></div>
    <a href="admin.html" class="btn ghost sm" style="text-decoration:none">Admin</a>
  </div>

  <div class="wrap">
  <!-- AVISO "INSTALAR APP": lo muestra u oculta js/instalar.js. Para cambiar el texto, edítalo aquí. -->
  <div id="instalarBox" class="instalar hide" role="region" aria-label="Instalar la app">
    <div class="instalar-txt">
      <b>📲 Instala la app en tu celular</b>
      <span>Queda el ícono en tu pantalla de inicio y abres la página con un toque.</span>
    </div>
    <div class="instalar-acc">
      <button class="btn sm" id="instalarBtn" type="button">Instalar app</button>
      <button class="btn sm ghost" id="instalarCerrar" type="button" aria-label="Cerrar aviso">✕</button>
    </div>
    <div class="instalar-pasos sub hide" id="instalarPasos" aria-live="polite"></div>
  </div>
    <!-- TÍTULO PRINCIPAL -->
    <div class="hero">
      <h1>Reserva tu cita</h1>
      <p class="sub">Elige tus servicios, profesional, fecha y hora. Sin llamadas.</p>
    </div>

    <div class="grid g2">
      <!-- PASO 1: servicios (se cargan desde la base de datos) -->
      <div class="card">
        <h2>1. Servicios</h2>
        <p class="sub" style="font-size:13px;margin:-6px 0 10px">Puedes elegir varios (ej: uñas + cejas).</p>
        <div id="servicios"></div>
        <div class="total" id="totalBox">Total: <b id="total">—</b></div>
      </div>

      <!-- PASO 2: profesional, fecha, hora y datos del cliente -->
      <div class="card">
        <h2>2. Detalles</h2>
        <label for="barbero">Profesional</label>
        <select id="barbero"></select>
        <p class="sub" id="horarioBarbero" style="font-size:13px;margin-top:6px"></p>

        <label for="fecha">Fecha</label>
        <input type="date" id="fecha">

        <label>Hora disponible</label>
        <div class="slots" id="horas"></div>

        <label for="nombre">Tu nombre</label>
        <input id="nombre" placeholder="Ej: Juan Pérez" maxlength="80">

        <label for="telefono">Teléfono / WhatsApp</label>
        <input id="telefono" type="tel" placeholder="809-000-0000" maxlength="30">

        <div class="mt"><button class="btn big" id="reservar">Reservar cita</button></div>
        <div id="resultado"></div>
      </div>
    </div>
  </div>

  <script src="js/instalar.js"></script>
  <script src="js/push.js"></script>
  <script src="js/reservar.js"></script>
</body>
</html>
